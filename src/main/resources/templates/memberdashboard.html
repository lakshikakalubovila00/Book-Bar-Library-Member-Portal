<!DOCTYPE html>
<html lang="en">
<head th:replace="~{headerfragment::headFragment}"></head>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="resources/css/memberdashboard.css">

</head>

<body>
<div class="container-fluid">
    <!-- htmlfile, fragment -->
    <nav th:replace="~{sidebar::sidebarFragment}"></nav>

    <!-- welcome text -->
    <div class="row mt-4  ms-2 me-2 welcome-text text-center">
        <div class="col">
            <!-- welcome text with username -->
            <span class="fw-bold" style="font-size: x-large">Welcome, </span><span style="font-size: x-large" class="fw-bold" th:text="${loggedusername}">Username </span><span style="font-size: x-large" class="fw-bold">!</span>
        </div>
    </div>

    <!-- Quick Access -->
    <div class="row mt-3 ms-2 me-2 row-cols-5">
        <div class="col d-flex flex-column align-items-center justify-content-center">
            <button class="quick-access-button" id="opacAccess" onclick="window.location.href='/catalog'">
                <div class="row">
                    <div class="col-3">
                        <img  class="icon-img me-2 ms-2" src="/resources/images/search.png">
                    </div>
                    <div class="col-9">
                        <h6 class="fw-bold mt-2">OPAC</h6>
                    </div>
                </div>
            </button>
        </div>
        <div class="col d-flex flex-column align-items-center justify-content-center">
            <button class="quick-access-button" id="myBorrowingsAccess" onclick="window.location.href='/myborrowings'">
                <div class="row">
                    <div class="col-3">
                        <img  class="icon-img me-2 ms-2" src="/resources/images/borrow.png">
                    </div>
                    <div class="col-9">
                        <h6 class="fw-bold mt-2">My Borrowings</h6>
                    </div>
                </div>
            </button>
        </div>
        <div class="col d-flex flex-column align-items-center justify-content-center">
            <button class="quick-access-button" id="myReservationsAccess" onclick="window.location.href='/myreservations'">
                <div class="row">
                    <div class="col-3">
                        <img  class="icon-img me-2 ms-2" src="/resources/images/reserved.png">
                    </div>
                    <div class="col-9">
                        <h6 class="fw-bold mt-2">My Reservations</h6>
                    </div>
                </div>
            </button>
        </div>
        <div class="col d-flex flex-column align-items-center justify-content-center">
            <button class="quick-access-button" id="renewBookAccess" onclick="window.location.href='/renewal'">
                <div class="row">
                    <div class="col-3">
                        <img  class="icon-img me-2 ms-2" src="/resources/images/renew.png">
                    </div>
                    <div class="col-9">
                        <h6 class="fw-bold mt-2">Renew Books</h6>
                    </div>
                </div>
            </button>
        </div>
        <div class="col d-flex flex-column align-items-center justify-content-center">
            <button class="quick-access-button" id="addReservationAccess" onclick="window.location.href='/reservation'">
                <div class="row">
                    <div class="col-3">
                        <img  class="icon-img me-2 ms-2" src="/resources/images/reserved.png">
                    </div>
                    <div class="col-9">
                        <h6 class="fw-bold mt-2">Add Reservation</h6>
                    </div>
                </div>
            </button>
        </div>
    </div>

    <!-- current borrowings-->
    <div class="row mt-3  ms-4 me-2">
        <div class="col card-current-borrowings me-3">
            <div class="row mt-2">
                <h5 class="fw-bold sub-text">Current Borrowings</h5>
            </div>
            <div class="row mt-2 mb-3" id="currentBorrowingsContainer"></div>
        </div>
    </div>
    <!-- Current Reservations -->
    <div class="row mt-3  ms-4 me-2">
        <div class="col card-current-reservations me-3">
            <div class="row mt-2">
                <h5 class="fw-bold sub-text">Current Reservations</h5>
            </div>
            <div class="row mt-2 mb-3" id="currentReservationsContainer"></div>
        </div>
    </div>
</div>
<div th:replace="~{footerfragment::bottomFragment}"></div>
<script src="controljs/dashboard.js"></script>
</body>
</html>
